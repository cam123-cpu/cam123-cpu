# Draws the animated "snake eating your contributions" graph on your profile.
# Runs daily; publishes the SVGs to the `output` branch.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#06b6d4&color_dots=#ebedf0,#c7d2fe,#818cf8,#6366f1,#4338ca
            dist/snake-dark.svg?palette=github-dark&color_snake=#06b6d4&color_dots=#161b22,#1e1b4b,#3730a3,#6366f1,#06b6d4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
